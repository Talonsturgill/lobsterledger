[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lobster-ledger"
version = "0.1.0"
description = "Policy gate and append-only ledger for AI agent payments over Lightning and Base."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Arctic Intelligence"}]
dependencies = [
    "mcp[cli]>=1.2.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
lobster-ledger = "lobster_ledger.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lobster_ledger"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
python_version = "3.10"
warn_unused_ignores = true
files = ["src/lobster_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

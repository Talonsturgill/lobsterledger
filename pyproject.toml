[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lobster-ledger"
version = "0.1.0"
description = "Policy gate and append-only ledger for AI agent payments over Lightning and Base."
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [{name = "Arctic Intelligence"}]
dependencies = [
    "mcp[cli]>=1.27,<2",
    "pydantic>=2.13.3",
    "httpx>=0.27.0",
    "python-dotenv>=1.1.1",
    "nostr-sdk>=0.44,<0.45",
    "bolt11>=2.2,<3",
    "lnurl>=2.0,<3",
    "cdp-sdk==1.44.0",
    "web3>=7.15,<8",
    "eth-account>=0.13.7,<0.14",
    "fastapi>=0.118.0",
    "jinja2>=3.1.4",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "pytest-xdist>=3.6.0",
    "hypothesis>=6.120.0",
    "ruff>=0.15.0",
    "mypy>=1.20.0",
    "httpx>=0.27.0",
    "respx>=0.22.0",
]

[project.scripts]
lobster-ledger = "lobster_ledger.server:main"
lobster-ledger-dashboard = "lobster_ledger.dashboard.app:main"
lobster-ledger-reconcile = "lobster_ledger.reconcile.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lobster_ledger"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "LOG", "PERF", "TRY"]

[tool.mypy]
strict = true
python_version = "3.12"
warn_unused_ignores = true
files = ["src/lobster_ledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
